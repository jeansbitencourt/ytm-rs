[package]
name = "ytm-rs"
version = "0.1.0"
edition = "2021"
authors = ["Jean Bitencourt <jean@omarchy.org>"]
description = "YouTube Music TUI and background daemon for Omarchy"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui-image = { version = "2.0", features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6.1"
rusqlite = { version = "0.32", features = ["bundled"] }
souvlaki = "0.7"
sha1 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
