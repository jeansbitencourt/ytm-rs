<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ytm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FBC8F"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="64" height="64" rx="14" fill="#14191c"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#222a30" stroke-width="1.5"/>

  <!-- YouTube Music circular ring badge -->
  <circle cx="32" cy="32" r="22" fill="#1a2125" stroke="url(#ytm-grad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#3a4a55" stroke-dasharray="2,3" stroke-width="1.5"/>

  <!-- Play button triangle -->
  <polygon points="28,24 41,32 28,40" fill="url(#wave-grad)"/>

  <!-- Sound wave accents -->
  <circle cx="32" cy="18" r="1.5" fill="#4ECDC4"/>
  <circle cx="32" cy="46" r="1.5" fill="#8FBC8F"/>
</svg>
